name: Trading Bot Cloud

on:
  schedule:
    - cron: '0 * * * *'  # Se ejecuta automáticamente cada 1 hora
  workflow_dispatch:      # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Permite guardar el archivo supertrend_state.json en el repo
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar el Super Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Guardar y sincronizar estado en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash
          git pull origin main --rebase || true
          git stash pop || true
          git add supertrend_state.json
          git diff --staged --quiet || git commit -m "🤖 Actualizar estado de Supertrend del bot"
          git push origin main
